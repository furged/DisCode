<style>
:root{
  --bg:#f7f3ec; --surface:#fbf8f3; --sunken:#f1ebe0; --ink:#1d1a17; --muted:#8c857a;
  --line:#e4ddd0; --line-strong:#cfc6b6; --ok:#5f8a5a; --err:#b4543f; --warn:#c28a5a;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
  --ease:cubic-bezier(.22,.61,.36,1); --t:.25s;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;height:100dvh;background:var(--bg);color:var(--ink);
  font-family:var(--mono);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
::selection{background:#e6dcc8}
.inner{width:100%;max-width:760px;margin:0 auto;padding:0 24px}
.mark{display:block;color:var(--ink);flex:none}
.mark.sm{width:24px;height:auto}
.mark.lg{width:44px;height:auto}

/* controls */
input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;outline:none;transition:border-color var(--t) var(--ease),background var(--t) var(--ease)}
input::placeholder{color:#b3ab9d}
input:hover{border-color:var(--line-strong)}
input:focus{border-color:var(--ink);background:#fff}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);
  padding:9px 16px;transition:background var(--t) var(--ease),color var(--t) var(--ease),border-color var(--t) var(--ease),transform .12s var(--ease),opacity var(--t)}
button:hover{background:#3a352f;border-color:#3a352f}
button:active{transform:scale(.97)}
button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* landing */
#landing{position:fixed;inset:0;z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:center;
  padding:24px;transition:opacity .45s var(--ease),visibility .45s}
#landing.dismiss{opacity:0;visibility:hidden;pointer-events:none}
#landingInner{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:420px;
  animation:rise .7s var(--ease) both}
#wordmark{margin:18px 0 4px;font-size:22px;font-weight:600;letter-spacing:-.01em}
#landingTag{margin:0;color:var(--muted);font-size:13px}
#landingSub{margin:36px 0 18px;font-size:13px}
#landingStage{display:grid;width:100%}
#landingChoices,#landingForm{grid-area:1/1;transition:opacity .3s var(--ease),transform .3s var(--ease),visibility 0s}
#landingChoices{display:flex;flex-direction:column;gap:10px}
#landingChoices.hidden{opacity:0;transform:translateY(-6px);visibility:hidden;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease),visibility 0s .3s}
.landing-choice-wrap{display:contents}
.landing-choice{background:transparent;color:var(--ink);border-color:var(--line-strong);padding:11px 16px}
.landing-choice:hover{background:var(--sunken);border-color:var(--ink);color:var(--ink)}
#landingForm{opacity:0;transform:translateY(8px);visibility:hidden;pointer-events:none;text-align:left;transition:opacity .3s var(--ease),transform .3s var(--ease),visibility 0s .3s}
#landingForm.visible{opacity:1;transform:none;visibility:visible;pointer-events:auto;transition-delay:.12s,.12s,0s}
#landingFormRow{display:flex;gap:8px}
#landingInput{flex:1;min-width:0}
#landingError{min-height:22px;margin-top:8px;color:var(--err);font-size:12.5px}
#landingBack{background:none;border:none;color:var(--muted);padding:2px 0;border-radius:4px}
#landingBack:hover{background:none;color:var(--ink)}

/* header */
header{flex:none;border-bottom:1px solid var(--line);background:var(--bg)}
header .inner{display:flex;align-items:center;gap:12px;height:56px}
header .name{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;margin-right:auto}
#indexedBadge{display:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--muted);font-size:12px;animation:fade .4s var(--ease)}
#indexedBadge .repo{color:var(--ink)}
#status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;white-space:nowrap}
#status .dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);transition:background var(--t) var(--ease)}
#status.ok .dot{background:var(--ok)}
#status.down .dot{background:var(--err)}

/* index panel */
#indexPanel{flex:none;padding:14px 0;border-bottom:1px solid var(--line)}
#indexRow{display:flex;align-items:center;gap:10px}
#indexRow .label{color:var(--muted);font-size:12px}
#repoInput{flex:1;min-width:0}
#indexStatusLine{min-height:20px;margin-top:8px;color:var(--muted);font-size:12px}
#indexStatusLine.error{color:var(--err)}

/* transcript */
#transcript{flex:1;min-height:0;overflow-y:auto;padding:28px max(24px,calc((100% - 712px)/2));scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.turn{margin-bottom:34px}
.turn:last-child{animation:rise .45s var(--ease) both}
.prompt-line{font-weight:600;margin-bottom:10px}
.sigil{color:var(--muted);margin-right:10px;font-weight:400}
.system-line,.answer-line{display:flex;gap:10px;margin-bottom:12px}
.system-line{color:var(--muted);font-size:12.5px}
.system-line.error .msg{color:var(--err)}
.tag{color:var(--muted);flex:none;font-size:12.5px}
.answer-line .msg{white-space:pre-wrap;min-width:0;overflow-wrap:anywhere}
.inline-code{background:var(--sunken);border-radius:4px;padding:1px 5px;font-size:.92em}

.refs-toggle{margin-top:6px}
.refs-toggle summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;list-style:none;color:var(--muted);
  font-size:12.5px;user-select:none;transition:color var(--t)}
.refs-toggle summary::-webkit-details-marker{display:none}
.refs-toggle summary:hover{color:var(--ink)}
.chevron{width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;
  transform:rotate(-45deg);transition:transform var(--t) var(--ease)}
.refs-toggle[open] .chevron{transform:rotate(45deg)}
.refs-toggle[open] .results{animation:rise .35s var(--ease) both}
.results{display:flex;flex-direction:column;gap:14px;margin-top:12px}

.result{border:1px solid var(--line);background:var(--surface);border-radius:10px;overflow:hidden;
  transition:border-color var(--t) var(--ease)}
.result:hover{border-color:var(--line-strong)}
.result-head{display:flex;justify-content:space-between;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);
  color:var(--muted);font-size:12px}
.result-head .loc{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.result-head .type{color:var(--muted);margin-right:8px}
.result-body{margin:0;padding:14px;overflow-x:auto;background:var(--sunken);font-size:12.5px;line-height:1.6;
  scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
.result-body code{font-family:var(--mono);background:none;padding:0}
.distance-row{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.distance-bar{width:80px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.distance-bar span{display:block;height:100%;background:var(--ink);animation:grow .7s var(--ease) both;transform-origin:left}
.distance-bar.weak span{background:var(--warn)}

/* highlight.js, muted warm palette */
.hljs-keyword,.hljs-selector-tag,.hljs-literal{color:#9a4a3a}
.hljs-string,.hljs-regexp{color:#5f7d4e}
.hljs-comment,.hljs-quote{color:#a39b8d;font-style:italic}
.hljs-number,.hljs-attr,.hljs-meta{color:#a87428}
.hljs-title,.hljs-function .hljs-title,.hljs-class .hljs-title{color:#3d5a80}
.hljs-built_in,.hljs-type,.hljs-params{color:#6a5a8a}

/* input row */
#inputRow{flex:none;padding:14px 0 20px;border-top:1px solid var(--line);background:var(--bg)}
#inputRow .inner{display:flex;align-items:center;gap:10px}
#inputRow .sigil{margin:0}
#q{flex:1;min-width:0}

@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:560px){
  .inner{padding:0 16px} #transcript{padding:22px 16px}
  #indexedBadge{display:none!important} #indexRow .label{display:none}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<script>
  const API_URL = "http://127.0.0.1:8000";
  const STORAGE_KEY = "discode_session_history";

  const transcript = document.getElementById("transcript");
  const input = document.getElementById("q");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");

  const repoInput = document.getElementById("repoInput");
  const indexBtn = document.getElementById("indexBtn");
  const indexStatusLine = document.getElementById("indexStatusLine");
  const indexedBadge = document.getElementById("indexedBadge");
  const indexedBadgeText = document.getElementById("indexedBadgeText");

  const landing = document.getElementById("landing");
  const landingChoices = document.getElementById("landingChoices");
  const landingForm = document.getElementById("landingForm");
  const landingInput = document.getElementById("landingInput");
  const landingSubmit = document.getElementById("landingSubmit");
  const landingBack = document.getElementById("landingBack");
  const landingError = document.getElementById("landingError");

  const LANDING_PLACEHOLDERS = {
    local: "C:\\path\\to\\your\\repo",
    github: "github.com/owner/repo",
  };
  let landingMode = null;

  function selectLandingMode(mode) {
    landingMode = mode;
    landingInput.placeholder = LANDING_PLACEHOLDERS[mode];
    landingChoices.classList.add("hidden");
    landingForm.classList.add("visible");
    landingError.textContent = "";
    landingInput.value = "";
    setTimeout(() => landingInput.focus(), 80);
  }

  landingChoices.querySelectorAll(".landing-choice").forEach((btn) => {
    btn.addEventListener("click", () => selectLandingMode(btn.dataset.mode));
  });

  landingBack.addEventListener("click", () => {
    landingMode = null;
    landingForm.classList.remove("visible");
    landingChoices.classList.remove("hidden");
    landingError.textContent = "";
  });

  function dismissLanding() {
    landing.classList.add("dismiss");
    setTimeout(() => { landing.style.display = "none"; }, 500);
  }

  async function submitLanding() {
    const value = landingInput.value.trim();
    if (!value) {
      landingError.textContent = "Type a path or link first";
      return;
    }
    landingSubmit.disabled = true;
    repoInput.value = value;
    dismissLanding();
    await startIndexJob(value);
  }

  landingSubmit.addEventListener("click", submitLanding);
  landingInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitLanding();
  });

  function loadHistory() {
    try {
      const raw = sessionStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveHistory(history) {
    try {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch { /* storage full or unavailable — non-fatal */ }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function timeAgo(unixSeconds) {
    const diffSec = Math.max(0, Math.floor(Date.now() / 1000 - unixSeconds));
    if (diffSec < 60) return "just now";
    const min = Math.floor(diffSec / 60);
    if (min < 60) return `${min} min ago`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}h ago`;
    return `${Math.floor(hr / 24)}d ago`;
  }

  function formatAnswer(text) {
    let safe = escapeHtml(text);
    safe = safe.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
    safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    safe = safe.replace(/^#{1,6}\s+/gm, "");
    safe = safe.replace(/(\s)(\d+\.\s)/g, "\n$2");
    safe = safe.replace(/(\s)([-*]\s)/g, "\n$2");
    return safe;
  }

  const HLJS_LANGUAGE_MAP = {
    js: "javascript", jsx: "javascript",
    ts: "typescript", tsx: "typescript",
    py: "python", go: "go", rs: "rust", java: "java", rb: "ruby",
    c: "c", h: "c",
    cpp: "cpp", cc: "cpp", cxx: "cpp", hpp: "cpp", hh: "cpp",
  };

  function hljsLanguageFor(filePath) {
    const ext = filePath.split(".").pop().toLowerCase();
    return HLJS_LANGUAGE_MAP[ext] || null;
  }

  function renderTurn(turn) {
    const wrap = document.createElement("div");
    wrap.className = "turn";

    const promptLine = document.createElement("div");
    promptLine.className = "prompt-line";
    promptLine.innerHTML = `<span class="sigil">&gt;</span>${escapeHtml(turn.question)}`;
    wrap.appendChild(promptLine);

    if (turn.error) {
      const err = document.createElement("div");
      err.className = "system-line error";
      err.innerHTML = `<span class="tag">[system]</span><span class="msg">${escapeHtml(turn.error)}</span>`;
      wrap.appendChild(err);
      transcript.appendChild(wrap);
      return;
    }

    if (turn.was_corrected) {
      const line = document.createElement("div");
      line.className = "system-line";
      line.innerHTML = `<span class="tag">[system]</span><span class="msg">Retried with: "${escapeHtml(turn.final_query)}"</span>`;
      wrap.appendChild(line);
    }

    if (!turn.results || turn.results.length === 0) {
      const none = document.createElement("div");
      none.className = "system-line";
      none.innerHTML = `<span class="tag">[system]</span><span class="msg">No matching code found</span>`;
      wrap.appendChild(none);
      transcript.appendChild(wrap);
      return;
    }

    if (turn.answer) {
      const ans = document.createElement("div");
      ans.className = "answer-line";
      ans.innerHTML = `<span class="tag">[system]</span><span class="msg">${formatAnswer(turn.answer)}</span>`;
      wrap.appendChild(ans);
    } else {
      const note = document.createElement("div");
      note.className = "system-line";
      note.innerHTML = `<span class="tag">[system]</span><span class="msg">Couldn't write a summary — showing raw matches</span>`;
      wrap.appendChild(note);
    }

    const details = document.createElement("details");
    details.className = "refs-toggle";
    if (!turn.answer) details.open = true;

    const summary = document.createElement("summary");
    const count = turn.results.length;
    summary.innerHTML = `<span class="chevron"></span>${count} code reference${count > 1 ? "s" : ""}`;
    details.appendChild(summary);

    const resultsWrap = document.createElement("div");
    resultsWrap.className = "results";
    turn.results.forEach(r => resultsWrap.appendChild(renderResult(r)));
    details.appendChild(resultsWrap);

    wrap.appendChild(details);
    transcript.appendChild(wrap);
  }

  function renderResult(r) {
    const card = document.createElement("div");
    card.className = "result";

    const head = document.createElement("div");
    head.className = "result-head";
    const shortPath = r.file_path.split(/[\\/]/).pop();
    head.innerHTML = `
      <span class="loc"><span class="type">${escapeHtml(r.type)}</span>${escapeHtml(r.name)}</span>
      <span>${escapeHtml(shortPath)}:${r.start_line}-${r.end_line}</span>
    `;
    card.appendChild(head);

    const body = document.createElement("pre");
    body.className = "result-body";
    const codeEl = document.createElement("code");
    const lang = hljsLanguageFor(r.file_path);
    if (lang) codeEl.className = `language-${lang}`;
    codeEl.textContent = r.code;
    body.appendChild(codeEl);
    card.appendChild(body);

    if (window.hljs && lang) {
      try { window.hljs.highlightElement(codeEl); } catch { /* worst case, code just shows unhighlighted */ }
    }

    const distRow = document.createElement("div");
    distRow.className = "distance-row";
    const pct = Math.max(0, Math.min(1, 1 - r.distance)) * 100;
    const isWeak = r.distance > 0.85;
    distRow.innerHTML = `
      <span>distance ${r.distance.toFixed(3)}</span>
      <span class="distance-bar${isWeak ? " weak" : ""}"><span style="width:${pct}%"></span></span>
    `;
    card.appendChild(distRow);

    return card;
  }

  function renderAll() {
    transcript.innerHTML = "";
    loadHistory().forEach(renderTurn);
    transcript.scrollTop = transcript.scrollHeight;
  }

  async function checkHealth() {
    try {
      const res = await fetch(`${API_URL}/health`);
      if (res.ok) {
        statusEl.className = "ok";
        statusText.textContent = "Backend connected";
      } else {
        throw new Error("bad status");
      }
    } catch {
      statusEl.className = "down";
      statusText.textContent = "Backend unreachable — is api.py running?";
    }
  }

  function applyLastIndexInfo(info) {
    if (!info) return;
    indexedBadge.style.display = "inline-block";
    const failedNote = info.failed_count ? `, ${info.failed_count} failed` : "";
    indexedBadgeText.textContent = `${info.source_label} · ${info.chunk_count} chunks${failedNote}`;
    indexStatusLine.textContent = `Last indexed: ${info.source_label} — ${info.chunk_count} chunks${failedNote} · ${timeAgo(info.finished_at)}`;
    indexStatusLine.className = "";
  }

  async function checkLastIndex() {
    try {
      const res = await fetch(`${API_URL}/api/status`);
      if (!res.ok) return;
      const info = await res.json();
      applyLastIndexInfo(info);
      if (info) dismissLanding();
    } catch { /* backend unreachable — checkHealth already reports this */ }
  }

  function statusToLabel(job) {
    switch (job.status) {
      case "queued": return "Queued…";
      case "fetching": return "Fetching repo…";
      case "walking": return "Scanning repo for source files…";
      case "chunking": return "Parsing files into chunks…";
      case "embedding":
        return `Embedding ${job.processed}/${job.total}` +
               (job.current_name ? ` (${job.current_name})` : "") + "…";
      case "saving": return "Saving to database…";
      case "done": {
        const okCount = job.total - job.failed.length;
        const failedNote = job.failed.length ? `, ${job.failed.length} failed` : "";
        return `Indexed ${okCount}/${job.total} chunks${failedNote}`;
      }
      case "error": return `Indexing failed: ${job.error}`;
      default: return job.status;
    }
  }

  async function startIndexJob(source) {
    indexBtn.disabled = true;
    indexBtn.textContent = "…";
    indexStatusLine.className = "";
    indexStatusLine.textContent = "Starting…";

    try {
      const res = await fetch(`${API_URL}/api/index`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ repo_path: source }),
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        indexStatusLine.className = "error";
        indexStatusLine.textContent = body.detail || `Request failed (${res.status})`;
        indexBtn.disabled = false;
        indexBtn.textContent = "Index";
        return;
      }

      const { job_id } = await res.json();

      await new Promise((resolve) => {
        const poll = setInterval(async () => {
          let job;
          try {
            const statusRes = await fetch(`${API_URL}/api/index/${job_id}`);
            job = await statusRes.json();
          } catch {
            clearInterval(poll);
            indexStatusLine.className = "error";
            indexStatusLine.textContent = "Lost connection to backend while indexing";
            resolve();
            return;
          }

          const label = statusToLabel(job);
          indexStatusLine.className = job.status === "error" ? "error" : "";
          indexStatusLine.textContent = label;

          if (job.status === "done" || job.status === "error") {
            clearInterval(poll);
            if (job.status === "done") {
              const failedNote = job.failed.length ? `, ${job.failed.length} failed` : "";
              indexedBadge.style.display = "inline-block";
              indexedBadgeText.textContent = `${job.source_label} · ${job.total} chunks${failedNote}`;
            }
            resolve();
          }
        }, 1000);
      });
    } catch {
      indexStatusLine.className = "error";
      indexStatusLine.textContent = "Couldn't reach the backend — is api.py running on port 8000?";
    }

    indexBtn.disabled = false;
    indexBtn.textContent = "Index";
    landingSubmit.disabled = false;
  }

  indexBtn.addEventListener("click", () => {
    const path = repoInput.value.trim();
    if (!path) return;
    startIndexJob(path);
  });
  repoInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") indexBtn.click();
  });

  async function ask(question) {
    sendBtn.disabled = true;
    sendBtn.textContent = "…";

    const history = loadHistory();
    let turn = { question };

    try {
      const res = await fetch(`${API_URL}/api/search`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        if (res.status === 422) {
          turn.error = "Question rejected — try rephrasing (empty or too long?)";
        } else if (res.status === 503) {
          turn.error = "Search backend is unavailable right now — try again shortly";
        } else {
          turn.error = `Request failed (${res.status})`;
        }
      } else {
        const data = await res.json();
        turn = { question, ...data };
      }
    } catch {
      turn.error = "Couldn't reach the backend — is api.py running on port 8000?";
    }

    history.push(turn);
    saveHistory(history);

    try {
      renderAll();
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "Run";
      input.value = "";
      input.focus();
    }
  }

  function submit() {
    if (sendBtn.disabled) return;
    const value = input.value.trim();
    if (!value) return;
    ask(value);
  }

  sendBtn.addEventListener("click", submit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submit();
  });

  renderAll();
  checkHealth();
  checkLastIndex();
</script>

</body>
