<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DisCode</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap');

  :root {
    --bg: #0a0c0b;
    --panel: #101413;
    --panel-border: #1e2624;
    --text: #e8e6e1;
    --muted: #6b7573;
    --teal: #3fbfad;
    --teal-dim: #235f56;
    --yellow: #e8c547;
    --yellow-dim: #7a6a29;
    --down: #a85a4a;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Courier Prime', ui-monospace, monospace;
    letter-spacing: 0.02em; /* Courier Prime reads dense/heavy at default tracking - this airs it out */
  }

  body {
    display: flex;
    flex-direction: column;
    width: 100%;
    position: relative;
  }

  /* ================= landing screen ================= */

  #landing {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 350ms ease, transform 350ms ease;
  }

  #landing.dismiss {
    opacity: 0;
    transform: scale(0.94);
    pointer-events: none;
  }

  #landingInner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
    padding: 24px;
    max-width: 90vw;
  }

  #landingMascot .mouth { animation: blink 1.4s steps(1) infinite; }
  @keyframes blink { 0%, 45% { opacity: 1; } 50%, 95% { opacity: 0; } 100% { opacity: 1; } }

  #landingTitle {
    font-weight: 700;
    font-size: 20px;
    letter-spacing: 0.03em;
  }
  #landingTitle .bracket { color: var(--muted); }
  #landingTitle .accent { color: var(--teal); }

  #landingSub {
    color: var(--muted);
    font-size: 13px;
    margin-top: -12px;
    text-align: center;
  }

  #landingChoices {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .landing-choice {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    padding: 12px 20px;
    cursor: pointer;
  }

  .landing-choice:hover { border-color: var(--teal-dim); color: var(--teal); }
  .landing-choice.selected { border-color: var(--teal); color: var(--teal); background: rgba(63,191,173,0.08); }

  #landingForm {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: min(560px, 90vw);
  }

  #landingForm.visible { display: flex; }

  #landingFormRow {
    display: flex;
    gap: 8px;
    width: 100%;
  }

  #landingInput {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    caret-color: var(--teal);
    min-width: 0;
  }

  #landingInput:focus { border-color: var(--teal-dim); }
  #landingInput::placeholder { color: var(--muted); }

  #landingSubmit {
    background: var(--teal);
    border: 1px solid var(--teal);
    color: #06110f;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 18px;
    cursor: pointer;
    flex-shrink: 0;
  }

  #landingSubmit:hover:not(:disabled) { background: #56d1c0; }
  #landingSubmit:disabled { opacity: 0.5; cursor: default; }

  #landingBack {
    background: none;
    border: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
  }
  #landingBack:hover { color: var(--teal); }

  #landingError {
    color: var(--yellow);
    font-size: 12.5px;
    min-height: 1.2em;
  }

  /* ================= app shell ================= */

  header {
    display: flex;
    justify-content: center;
    border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
  }

  header .inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    width: 100%;
    max-width: 1400px;
    padding: 16px clamp(16px, 4vw, 48px);
  }

  header .name {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
    font-size: 16px;
  }

  header .name .bracket { color: var(--muted); }
  header .name .accent { color: var(--teal); }

  #mascot .mouth { animation: blink 1.4s steps(1) infinite; }

  #indexedBadge {
    font-size: 12.5px;
    color: var(--muted);
    border: 1px solid var(--panel-border);
    padding: 3px 10px;
    display: none; /* shown once something has actually been indexed */
  }

  #indexedBadge .repo { color: var(--yellow-dim); }

  #status {
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: auto;
  }

  #status .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }

  #status.ok .dot { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  #status.down .dot { background: var(--down); }

  #indexPanel {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    border-bottom: 1px solid var(--panel-border);
    background: var(--panel);
  }

  #indexPanel .inner {
    width: 100%;
    max-width: 1400px;
    padding: 12px clamp(16px, 4vw, 48px);
  }

  #indexRow { display: flex; align-items: center; gap: 10px; }

  #indexRow .label {
    font-size: 12.5px;
    color: var(--yellow);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }

  #repoInput {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 7px 10px;
    caret-color: var(--teal);
    min-width: 0;
  }

  #repoInput:focus { border-color: var(--teal-dim); }
  #repoInput::placeholder { color: var(--muted); }

  #indexBtn {
    background: var(--teal);
    border: 1px solid var(--teal);
    color: #06110f;
    font-family: inherit;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.02em;
    padding: 8px 16px;
    cursor: pointer;
    flex-shrink: 0;
  }

  #indexBtn:hover:not(:disabled) { background: #56d1c0; }
  #indexBtn:disabled { cursor: default; opacity: 0.5; }

  #indexStatusLine {
    font-size: 12.5px;
    color: var(--muted);
    padding-top: 8px;
    min-height: 1.4em;
  }

  #indexStatusLine.error { color: var(--yellow); }

  #transcript {
    flex: 1;
    overflow-y: auto;
    padding: 24px clamp(16px, 4vw, 48px) 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    width: 100%;
  }

  .turn {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    max-width: 1100px;
    animation: reveal 180ms ease-out;
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .prompt-line { color: var(--text); font-size: 16px; }
  .prompt-line .sigil { color: var(--teal); margin-right: 8px; font-weight: 700; }

  .system-line { display: flex; gap: 8px; align-items: baseline; font-size: 14px; }
  .system-line .tag { color: var(--teal); flex-shrink: 0; }
  .system-line .msg { color: var(--muted); font-style: italic; }
  .system-line.error .tag { color: var(--yellow); }
  .system-line.error .msg { color: var(--yellow); font-style: normal; }

  .answer-line { display: flex; gap: 8px; align-items: baseline; font-size: 15.5px; line-height: 1.65; }
  .answer-line .tag { color: var(--teal); flex-shrink: 0; }
  .answer-line .msg { color: var(--text); white-space: pre-wrap; }

  .refs-toggle summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 13.5px;
    list-style: none;
    padding: 4px 0;
  }
  .refs-toggle summary::-webkit-details-marker { display: none; }
  .refs-toggle summary .chevron::before { content: "▸ "; color: var(--teal-dim); }
  .refs-toggle[open] summary .chevron::before { content: "▾ "; }
  .refs-toggle summary:hover { color: var(--teal); }

  .results { display: flex; flex-direction: column; gap: 12px; padding-top: 10px; }

  .result { border: 1px solid var(--panel-border); background: var(--panel); }

  .result-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--panel-border);
    font-size: 13.5px;
    color: var(--muted);
  }

  .result-head .loc { color: var(--text); }
  .result-head .loc .type { color: var(--yellow-dim); margin-right: 6px; }

  .result-body {
    margin: 0;
    padding: 12px;
    font-size: 14px;
    line-height: 1.55;
    overflow-x: auto;
    white-space: pre;
    color: var(--text);
  }

  .distance-row { display: flex; align-items: center; gap: 8px; padding: 6px 12px 10px; font-size: 12.5px; color: var(--muted); }
  .distance-bar { flex: 1; max-width: 160px; height: 3px; background: var(--panel-border); position: relative; }
  .distance-bar > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--teal); }
  .distance-bar.weak > span { background: var(--yellow); }

  #inputRow {
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    border-top: 1px solid var(--panel-border);
  }

  #inputRow .inner {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 1400px;
    padding: 14px clamp(16px, 4vw, 48px) 18px;
  }

  #inputRow .sigil { color: var(--teal); font-size: 16px; font-weight: 700; }

  #q {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    caret-color: var(--teal);
  }
  #q::placeholder { color: var(--muted); }

  #send {
    flex-shrink: 0;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    font-family: inherit;
    font-size: 13.5px;
    padding: 6px 14px;
    cursor: pointer;
  }
  #send:hover:not(:disabled) { border-color: var(--teal-dim); color: var(--teal); }
  #send:disabled { cursor: default; opacity: 0.5; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--panel-border); }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ================= syntax highlighting (highlight.js classes, custom-mapped) ================= */
  .hljs-comment, .hljs-quote { color: var(--muted); font-style: italic; }
  .hljs-keyword, .hljs-selector-tag, .hljs-literal, .hljs-subst { color: var(--teal); }
  .hljs-string, .hljs-doctag, .hljs-regexp { color: var(--yellow); }
  .hljs-number, .hljs-meta { color: var(--yellow-dim); }
  .hljs-title, .hljs-title.function_, .hljs-title.class_ { color: var(--teal); font-weight: 700; }
  .hljs-params, .hljs-variable, .hljs-attr, .hljs-property { color: var(--text); }
  .hljs-built_in, .hljs-type { color: var(--yellow-dim); }
  .hljs-tag, .hljs-name { color: var(--teal); }
  .hljs-symbol, .hljs-bullet { color: var(--yellow); }

  .answer-line code.inline-code {
    color: var(--yellow);
    background: rgba(232, 197, 71, 0.08);
    padding: 1px 4px;
  }
  .answer-line strong { color: var(--teal); font-weight: 700; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

  <div id="landing">
    <div id="landingInner">
      <svg id="landingMascot" width="110" height="110" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <rect x="6" y="0" width="3" height="4" fill="var(--yellow)"/>
        <rect x="23" y="0" width="3" height="4" fill="var(--yellow)"/>
        <rect x="4" y="4" width="24" height="24" rx="2" fill="#0a0c0b" stroke="var(--teal)" stroke-width="2"/>
        <rect x="9" y="12" width="4" height="4" fill="var(--yellow)"/>
        <rect x="19" y="12" width="4" height="4" fill="var(--yellow)"/>
        <rect class="mouth" x="12" y="20" width="8" height="3" fill="var(--teal)"/>
      </svg>
      <div id="landingTitle"><span class="bracket">[</span><span class="accent">what dis code sayin?</span><span class="bracket">]</span></div>
      <div id="landingSub">index a codebase to start asking it questions</div>

      <div id="landingChoices">
        <button class="landing-choice" data-mode="local">index a local folder</button>
        <button class="landing-choice" data-mode="github">index a github repo</button>
      </div>

      <div id="landingForm">
        <div id="landingFormRow">
          <input id="landingInput" type="text" autocomplete="off" />
          <button id="landingSubmit">index</button>
        </div>
        <div id="landingError"></div>
        <button id="landingBack">back</button>
      </div>
    </div>
  </div>

  <header>
    <div class="inner">
      <div class="name">
        <svg id="mascot" width="26" height="26" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="0" width="3" height="4" fill="var(--yellow)"/>
          <rect x="23" y="0" width="3" height="4" fill="var(--yellow)"/>
          <rect x="4" y="4" width="24" height="24" rx="2" fill="#0a0c0b" stroke="var(--teal)" stroke-width="2"/>
          <rect x="9" y="12" width="4" height="4" fill="var(--yellow)"/>
          <rect x="19" y="12" width="4" height="4" fill="var(--yellow)"/>
          <rect class="mouth" x="12" y="20" width="8" height="3" fill="var(--teal)"/>
        </svg>
        <span class="bracket">[</span><span class="accent">what dis code sayin?</span><span class="bracket">]</span>
      </div>
      <div id="indexedBadge">indexed: <span class="repo" id="indexedBadgeText"></span></div>
      <div id="status"><span class="dot"></span><span id="statusText">checking backend…</span></div>
    </div>
  </header>

  <div id="indexPanel">
    <div class="inner">
      <div id="indexRow">
        <span class="label">index</span>
        <input id="repoInput" type="text" placeholder="local path or github.com/owner/repo" autocomplete="off" />
        <button id="indexBtn">index</button>
      </div>
      <div id="indexStatusLine"></div>
    </div>
  </div>

  <div id="transcript"></div>

  <div id="inputRow">
    <div class="inner">
      <span class="sigil">&gt;</span>
      <input id="q" type="text" placeholder="ask a question about the indexed code…" autocomplete="off" />
      <button id="send">run</button>
    </div>
  </div>

<script>
  const API_URL = "http://127.0.0.1:8000";
  const STORAGE_KEY = "discode_session_history";

  const transcript = document.getElementById("transcript");
  const input = document.getElementById("q");
  const sendBtn = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const statusText = document.getElementById("statusText");

  const repoInput = document.getElementById("repoInput");
  const indexBtn = document.getElementById("indexBtn");
  const indexStatusLine = document.getElementById("indexStatusLine");
  const indexedBadge = document.getElementById("indexedBadge");
  const indexedBadgeText = document.getElementById("indexedBadgeText");

  // ---------- landing screen ----------

  const landing = document.getElementById("landing");
  const landingChoices = document.getElementById("landingChoices");
  const landingForm = document.getElementById("landingForm");
  const landingInput = document.getElementById("landingInput");
  const landingSubmit = document.getElementById("landingSubmit");
  const landingBack = document.getElementById("landingBack");
  const landingError = document.getElementById("landingError");

  const LANDING_PLACEHOLDERS = {
    local: "C:\\path\\to\\your\\repo",
    github: "github.com/owner/repo",
  };
  let landingMode = null;

  function selectLandingMode(mode) {
    landingMode = mode;
    landingInput.placeholder = LANDING_PLACEHOLDERS[mode];
    landingChoices.style.display = "none";
    landingForm.classList.add("visible");
    landingError.textContent = "";
    landingInput.value = "";
    landingInput.focus();
  }

  landingChoices.querySelectorAll(".landing-choice").forEach((btn) => {
    btn.addEventListener("click", () => selectLandingMode(btn.dataset.mode));
  });

  landingBack.addEventListener("click", () => {
    landingMode = null;
    landingForm.classList.remove("visible");
    landingChoices.style.display = "flex";
    landingError.textContent = "";
  });

  function dismissLanding() {
    landing.classList.add("dismiss");
    // Wait for the fade/scale transition to finish before fully removing
    // it from layout - matches the 350ms transition set in CSS. A stray
    // extra 50ms guards against the transitionend event never firing in
    // some edge cases (tab backgrounded mid-animation, etc).
    setTimeout(() => { landing.style.display = "none"; }, 400);
  }

  async function submitLanding() {
    const value = landingInput.value.trim();
    if (!value) {
      landingError.textContent = "type a path or link first";
      return;
    }
    landingSubmit.disabled = true;
    repoInput.value = value; // carry it over so the persistent index bar reflects what's running
    dismissLanding();
    await startIndexJob(value);
  }

  landingSubmit.addEventListener("click", submitLanding);
  landingInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitLanding();
  });

  // ---------- session-only chat history (sessionStorage) ----------

  function loadHistory() {
    try {
      const raw = sessionStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  function saveHistory(history) {
    try {
      sessionStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch {
      // storage full or unavailable — non-fatal, history just won't persist across reload
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function timeAgo(unixSeconds) {
    const diffSec = Math.max(0, Math.floor(Date.now() / 1000 - unixSeconds));
    if (diffSec < 60) return "just now";
    const min = Math.floor(diffSec / 60);
    if (min < 60) return `${min} min ago`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr}h ago`;
    return `${Math.floor(hr / 24)}d ago`;
  }

  // Backstop for when the LLM ignores the "no markdown" instruction in
  // the synthesis prompt and answers with **bold**, `code spans`, or
  // markdown list syntax anyway. Converts the syntax into real styled
  // elements instead of just discarding it - escapes the raw text FIRST,
  // then only ever injects our own safe wrapper tags on top of the
  // already-escaped string, so nothing in the model's output can inject
  // arbitrary HTML.
  function formatAnswer(text) {
    let safe = escapeHtml(text);
    safe = safe.replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>');
    safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    safe = safe.replace(/^#{1,6}\s+/gm, "");
    safe = safe.replace(/(\s)(\d+\.\s)/g, "\n$2");
    safe = safe.replace(/(\s)([-*]\s)/g, "\n$2");
    return safe;
  }

  // Maps a file's extension to the language name highlight.js expects,
  // mirroring chunker.py's EXTENSION_TO_LANGUAGE on the backend.
  const HLJS_LANGUAGE_MAP = {
    js: "javascript", jsx: "javascript",
    ts: "typescript", tsx: "typescript",
    py: "python", go: "go", rs: "rust", java: "java", rb: "ruby",
    c: "c", h: "c",
    cpp: "cpp", cc: "cpp", cxx: "cpp", hpp: "cpp", hh: "cpp",
  };

  function hljsLanguageFor(filePath) {
    const ext = filePath.split(".").pop().toLowerCase();
    return HLJS_LANGUAGE_MAP[ext] || null;
  }

  // ---------- chat rendering ----------

  function renderTurn(turn) {
    const wrap = document.createElement("div");
    wrap.className = "turn";

    const promptLine = document.createElement("div");
    promptLine.className = "prompt-line";
    promptLine.innerHTML = `<span class="sigil">&gt;</span>${escapeHtml(turn.question)}`;
    wrap.appendChild(promptLine);

    if (turn.error) {
      const err = document.createElement("div");
      err.className = "system-line error";
      err.innerHTML = `<span class="tag">[system]</span><span class="msg">${escapeHtml(turn.error)}</span>`;
      wrap.appendChild(err);
      transcript.appendChild(wrap);
      return;
    }

    if (turn.was_corrected) {
      const line = document.createElement("div");
      line.className = "system-line";
      line.innerHTML = `<span class="tag">[system]</span><span class="msg">retried with: "${escapeHtml(turn.final_query)}"</span>`;
      wrap.appendChild(line);
    }

    if (!turn.results || turn.results.length === 0) {
      const none = document.createElement("div");
      none.className = "system-line";
      none.innerHTML = `<span class="tag">[system]</span><span class="msg">no matching code found</span>`;
      wrap.appendChild(none);
      transcript.appendChild(wrap);
      return;
    }

    if (turn.answer) {
      const ans = document.createElement("div");
      ans.className = "answer-line";
      ans.innerHTML = `<span class="tag">[system]</span><span class="msg">${formatAnswer(turn.answer)}</span>`;
      wrap.appendChild(ans);
    } else {
      const note = document.createElement("div");
      note.className = "system-line";
      note.innerHTML = `<span class="tag">[system]</span><span class="msg">couldn't write a summary — showing raw matches</span>`;
      wrap.appendChild(note);
    }

    const details = document.createElement("details");
    details.className = "refs-toggle";
    if (!turn.answer) details.open = true;

    const summary = document.createElement("summary");
    const count = turn.results.length;
    summary.innerHTML = `<span class="chevron"></span>${count} code reference${count > 1 ? "s" : ""}`;
    details.appendChild(summary);

    const resultsWrap = document.createElement("div");
    resultsWrap.className = "results";
    turn.results.forEach(r => resultsWrap.appendChild(renderResult(r)));
    details.appendChild(resultsWrap);

    wrap.appendChild(details);
    transcript.appendChild(wrap);
  }

  function renderResult(r) {
    const card = document.createElement("div");
    card.className = "result";

    const head = document.createElement("div");
    head.className = "result-head";
    const shortPath = r.file_path.split(/[\\/]/).pop();
    head.innerHTML = `
      <span class="loc"><span class="type">${escapeHtml(r.type)}</span>${escapeHtml(r.name)}</span>
      <span>${escapeHtml(shortPath)}:${r.start_line}-${r.end_line}</span>
    `;
    card.appendChild(head);

    const body = document.createElement("pre");
    body.className = "result-body";
    const codeEl = document.createElement("code");
    const lang = hljsLanguageFor(r.file_path);
    if (lang) codeEl.className = `language-${lang}`;
    codeEl.textContent = r.code;
    body.appendChild(codeEl);
    card.appendChild(body);

    if (window.hljs && lang) {
      try { window.hljs.highlightElement(codeEl); } catch { /* worst case, code just shows unhighlighted */ }
    }

    const distRow = document.createElement("div");
    distRow.className = "distance-row";
    const pct = Math.max(0, Math.min(1, 1 - r.distance)) * 100;
    const isWeak = r.distance > 0.85;
    distRow.innerHTML = `
      <span>distance ${r.distance.toFixed(3)}</span>
      <span class="distance-bar${isWeak ? " weak" : ""}"><span style="width:${pct}%"></span></span>
    `;
    card.appendChild(distRow);

    return card;
  }

  function renderAll() {
    transcript.innerHTML = "";
    loadHistory().forEach(renderTurn);
    transcript.scrollTop = transcript.scrollHeight;
  }

  // ---------- backend health + last-indexed badge ----------

  async function checkHealth() {
    try {
      const res = await fetch(`${API_URL}/health`);
      if (res.ok) {
        statusEl.className = "ok";
        statusText.textContent = "backend connected";
      } else {
        throw new Error("bad status");
      }
    } catch {
      statusEl.className = "down";
      statusText.textContent = "backend unreachable — is api.py running?";
    }
  }

  function applyLastIndexInfo(info) {
    if (!info) return;
    indexedBadge.style.display = "inline-block";
    const failedNote = info.failed_count ? `, ${info.failed_count} failed` : "";
    indexedBadgeText.textContent = `${info.source_label} · ${info.chunk_count} chunks${failedNote}`;
    indexStatusLine.textContent = `last indexed: ${info.source_label} — ${info.chunk_count} chunks${failedNote} · ${timeAgo(info.finished_at)}`;
    indexStatusLine.className = "";
  }

  async function checkLastIndex() {
    try {
      const res = await fetch(`${API_URL}/api/status`);
      if (!res.ok) return;
      const info = await res.json();
      applyLastIndexInfo(info);
      // If something was already indexed from a previous session, skip
      // the landing screen entirely - it's for first-time setup, not
      // something a returning user should have to click through again.
      if (info) dismissLanding();
    } catch {
      // backend unreachable — checkHealth already reports this
    }
  }

  // ---------- indexing ----------

  function statusToLabel(job) {
    switch (job.status) {
      case "queued": return "queued…";
      case "fetching": return "fetching repo…";
      case "walking": return "scanning repo for source files…";
      case "chunking": return "parsing files into chunks…";
      case "embedding":
        return `embedding ${job.processed}/${job.total}` +
               (job.current_name ? ` (${job.current_name})` : "") + "…";
      case "saving": return "saving to database…";
      case "done": {
        const okCount = job.total - job.failed.length;
        const failedNote = job.failed.length ? `, ${job.failed.length} failed` : "";
        return `indexed ${okCount}/${job.total} chunks${failedNote}`;
      }
      case "error": return `indexing failed: ${job.error}`;
      default: return job.status;
    }
  }

  async function startIndexJob(source) {
    indexBtn.disabled = true;
    indexBtn.textContent = "…";
    indexStatusLine.className = "";
    indexStatusLine.textContent = "starting…";

    try {
      const res = await fetch(`${API_URL}/api/index`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ repo_path: source }),
      });

      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        indexStatusLine.className = "error";
        indexStatusLine.textContent = body.detail || `request failed (${res.status})`;
        indexBtn.disabled = false;
        indexBtn.textContent = "index";
        return;
      }

      const { job_id } = await res.json();

      await new Promise((resolve) => {
        const poll = setInterval(async () => {
          let job;
          try {
            const statusRes = await fetch(`${API_URL}/api/index/${job_id}`);
            job = await statusRes.json();
          } catch {
            clearInterval(poll);
            indexStatusLine.className = "error";
            indexStatusLine.textContent = "lost connection to backend while indexing";
            resolve();
            return;
          }

          const label = statusToLabel(job);
          indexStatusLine.className = job.status === "error" ? "error" : "";
          indexStatusLine.textContent = label;

          if (job.status === "done" || job.status === "error") {
            clearInterval(poll);
            if (job.status === "done") {
              const failedNote = job.failed.length ? `, ${job.failed.length} failed` : "";
              indexedBadge.style.display = "inline-block";
              indexedBadgeText.textContent = `${job.source_label} · ${job.total} chunks${failedNote}`;
            }
            resolve();
          }
        }, 1000);
      });
    } catch {
      indexStatusLine.className = "error";
      indexStatusLine.textContent = "couldn't reach the backend — is api.py running on port 8000?";
    }

    indexBtn.disabled = false;
    indexBtn.textContent = "index";
    landingSubmit.disabled = false;
  }

  indexBtn.addEventListener("click", () => {
    const path = repoInput.value.trim();
    if (!path) return;
    startIndexJob(path);
  });
  repoInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") indexBtn.click();
  });

  // ---------- search ----------

  async function ask(question) {
    sendBtn.disabled = true;
    sendBtn.textContent = "…";

    const history = loadHistory();
    let turn = { question };

    try {
      const res = await fetch(`${API_URL}/api/search`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        if (res.status === 422) {
          turn.error = "question rejected — try rephrasing (empty or too long?)";
        } else if (res.status === 503) {
          turn.error = "search backend is unavailable right now — try again shortly";
        } else {
          turn.error = `request failed (${res.status})`;
        }
      } else {
        const data = await res.json();
        turn = { question, ...data };
      }
    } catch {
      turn.error = "couldn't reach the backend — is api.py running on port 8000?";
    }

    history.push(turn);
    saveHistory(history);

    // finally guarantees the button/input always reset, even if something
    // inside renderAll() throws (a bad response shape, a rendering bug,
    // etc) - without this, one bad render could leave the button stuck
    // disabled and the input never clearing, forever, until reload.
    try {
      renderAll();
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = "run";
      input.value = "";
      input.focus();
    }
  }

  function submit() {
    if (sendBtn.disabled) return; // ignore Enter/click spam while a request is in flight
    const value = input.value.trim();
    if (!value) return;
    ask(value);
  }

  sendBtn.addEventListener("click", submit);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") submit();
  });

  renderAll();
  checkHealth();
  checkLastIndex();
</script>

</body>
</html>
